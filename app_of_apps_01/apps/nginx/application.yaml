apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-app-of-apps-01
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nivetha676/argocd.git
    targetRevision: main
    path: app_of_apps_01/manifests/nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true