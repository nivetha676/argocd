apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-app-of-apps-02

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-app-of-apps-02

  template:
    metadata:
      labels:
        app: nginx-app-of-apps-02

    spec:
      containers:
      - name: nginx-app-of-apps-02
        image: nginx:latest

        ports:
        - containerPort: 80