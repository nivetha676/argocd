apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: argocd-demo

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/nivetha676/argocd.git

    targetRevision: HEAD

    path: app

  destination:

    server: https://kubernetes.default.svc

    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true